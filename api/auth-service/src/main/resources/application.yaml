spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${ECOMMERCE_DB_HOST}/${ECOMMERCE_DB}
    username: ${ECOMMERCE_DB_USER}
    password: ${ECOMMERCE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ # Point to your Eureka server
  instance:
    prefer-ip-address: true # Register using IP rather than hostname (great for Docker)

management:
  endpoints:
    web:
      exposure:
        include: health,info