spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://${ECOMMERCE_DB_HOST}/${ECOMMERCE_DB}
    username: ${ECOMMERCE_DB_USER}
    password: ${ECOMMERCE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: catalog-cache-invalidation-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"

server:
  port: 8082
  servlet:
    context-path: /catalog/

caches:
  product:
    ttl: 600 # seconds

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ # Point to your Eureka server
  instance:
    prefer-ip-address: true # Register using IP rather than hostname (great for Docker)

management:
  endpoints:
    web:
      exposure:
        include: health,info